# Render Blueprint — website + enquiry portal (Node).
# Trial setup: no database, so data lives in data/db.json and resets when the free instance restarts.
# For permanent data on Render add a Postgres database and set DATABASE_URL (see the commented block).
# Render dashboard → New → Blueprint → pick this repo. Set ADMIN_USERNAME (or ADMIN_EMAIL) and ADMIN_PASSWORD.
services:
  - type: web
    name: motamax-app
    runtime: node
    plan: free               # free tier sleeps after 15 min idle; use "starter" for always-on
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: motamax-db
      #     property: connectionString
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

