# Render Blueprint — website + enquiry portal (Node) with a Postgres database.
# Render dashboard → New → Blueprint → pick this repo. You will be asked for ADMIN_EMAIL and ADMIN_PASSWORD.
services:
  - type: web
    name: motamax-app
    runtime: node
    plan: free               # free tier sleeps after 15 min idle; use "starter" for always-on
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: motamax-db
          property: connectionString
      - key: ADMIN_NAME
        value: Administrator
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: motamax-db
    plan: free               # free Postgres expires after 30 days; use "basic-256mb" to keep data
    region: singapore
