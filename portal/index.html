<div class="ambient" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

<div class="p-shell" id="shell" hidden>

    <nav class="p-nav" id="nav" aria-label="Portal"></nav>
    <div class="p-traffic" id="traffic" aria-live="polite"></div>
    <div class="p-me" id="me"></div>
  </aside>
  <div class="p-main">
    <header class="p-top">
      <button class="p-icon p-burger" id="burger" aria-label="Menu"><svg><use href="#p-menu"/></svg></button>
      <h1 id="pageTitle">Dashboard</h1>
      <div class="p-top-actions">
        <button class="p-btn p-btn-primary" id="newEnquiry"><svg><use href="#p-plus"/></svg><span>New enquiry</span></button>
        <button class="p-icon" id="themeBtn" aria-label="Toggle dark mode"><svg><use href="#p-moon"/></svg></button>
      </div>
    </header>
    <main id="view" class="p-view" aria-live="polite"></main>
  </div>
